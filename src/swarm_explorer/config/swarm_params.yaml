---
# Configuration file for swarm parameters
# map_type: "occupancy_grid" # options: occupancy_grid, SLAM
# Communication parameters
comm_radius: 5.0
publish_rate: 5.0
max_neighbor_age: 2 # seconds
# Radii
cohesion_radius: 1.5
separation_radius: 0.65
alignment_radius: 1.5
collision_radius: 1.7 # obstacle avoidance radius
# Weights (tuned to reduce over-separation and encourage exploration progress)
alignment_weight: 0.15
cohesion_weight: 0.10
separation_weight: 0.20
# Stronger repulsion from environment borders (outer walls).
wall_weight: 1.3
frontier_weight: 0.14
# Increased to reduce wall contact before escape is needed.
obstacle_weight: 3.2
# Inter-robot collision avoidance (for bots converging to same frontier):
# - Increase `robot_collision_weight` to push bots apart harder.
# - Increase `robot_collision_radius_scale` to start repulsion earlier.
robot_collision_weight: 1.35
robot_collision_radius_scale: 1.2
frontier_dist_weight: 0.001
frontier_size_weight: 1.0
# Frontier selection tuning (global defaults; can override per robot with private params):
# - Increase `frontier_size_bonus_scale_m` to favor larger frontier regions
#   (more group-like behavior).
# - Decrease it to favor nearest frontier edges (more spread-out coverage).
frontier_min_region_size: 5
frontier_size_bonus_scale_m: 0.35
# define initial poses for each robot
initial_poses:
  - { x:  0.0, y:  0.0, theta: 0.0 } # robot 1
  - { x:  2.0, y:  0.0, theta: 0.0 } # robot 2
  - { x:  4.0, y:  0.0, theta: 0.0 } # robot 3
  - { x: -2.0, y:  0.0, theta: 0.0 } # robot 4
  - { x: -1.0, y:  2.0, theta: 0.0 } # robot 5