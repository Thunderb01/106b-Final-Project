---
# Configuration file for swarm parameters
# map_type: "occupancy_grid" # options: occupancy_grid, SLAM
# Communication parameters
comm_radius: 5.0
publish_rate: 5.0
max_neighbor_age: 2 # seconds
# Radii
cohesion_radius: 1.5
separation_radius: 0.65
alignment_radius: 1.5
collision_radius: 1.7 # obstacle avoidance radius
# Weights (tuned to reduce over-separation and encourage exploration progress)
alignment_weight: 0.15
cohesion_weight: 0.10
separation_weight: 0.20
wall_weight: 0.8
frontier_weight: 0.14
obstacle_weight: 2.2
frontier_dist_weight: 0.001
frontier_size_weight: 1.0
# define initial poses for each robot
initial_poses:
  - { x: 0.0, y: 0.0, theta: 0.0 } # robot 1
  - { x: 5.0, y: 1.0, theta: 0.0 } # robot 2
  - { x: 5.0, y: -5.0, theta: 0.0 } # robot 3